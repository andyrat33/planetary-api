version: 0.2

env:
  secrets-manager:
    DOCKER_HUB_USERNAME: "planetary-api/docker-credentials:DOCKER_HUB_USERNAME"
    DOCKER_HUB_PASSWORD: "planetary-api/docker-credentials:DOCKER_HUB_PASSWORD"

phases:
  install:
    commands:
      - npm install -g newman newman-reporter-htmlextra --quiet
      - echo "Logging in to Docker Hub..."
      - echo $DOCKER_HUB_PASSWORD | docker login -u $DOCKER_HUB_USERNAME --password-stdin
      - echo "Logging in to ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_URI

  pre_build:
    commands:
      - echo "Creating Docker test network..."
      - docker network create test-net

      - echo "Starting MySQL container..."
      - |
        docker run -d --name mysql-test --network test-net \
          -e MYSQL_ROOT_PASSWORD=rootpassword \
          -e MYSQL_DATABASE=planetary \
          mysql:5.7

      - echo "Waiting 25s for MySQL to be ready..."
      - sleep 25

      - echo "Starting Planetary API container..."
      - |
        docker run -d --name app-test --network test-net \
          -e DB_HOST=mysql-test \
          -e DB_USER=root \
          -e DB_PASSWORD=rootpassword \
          -e DB_NAME=planetary \
          -e MAIL_SERVER=localhost \
          -e MAIL_PORT=1025 \
          -e MAIL_USE_TLS=false \
          -p 5001:5000 \
          $ECR_URI:$CODEBUILD_RESOLVED_SOURCE_VERSION

      - echo "Waiting 10s for app to start..."
      - sleep 10

      - echo "Initialising database..."
      - docker exec app-test flask db_create
      - docker exec app-test flask db_seed

      - echo "Verifying app is responding..."
      - curl -f http://localhost:5001/ || (docker logs app-test && exit 1)

  build:
    commands:
      - echo "Running Postman security tests..."
      - |
        newman run planetary-api.postman_collection.json \
          -e Planetary-API-Environment.postman_environment.json \
          --folder Security \
          --reporters cli,junit,htmlextra \
          --reporter-junit-export security-report.xml \
          --reporter-htmlextra-export security-report.html \
          --env-var "baseUrl=http://localhost:5001" \
          --suppress-exit-code

  post_build:
    commands:
      - echo "Uploading security test reports to S3..."
      - aws s3 cp security-report.xml s3://$ARTIFACTS_BUCKET/postman-security/$CODEBUILD_BUILD_ID/security-report.xml || true
      - aws s3 cp security-report.html s3://$ARTIFACTS_BUCKET/postman-security/$CODEBUILD_BUILD_ID/security-report.html || true
      - echo "Stopping test containers..."
      - docker stop mysql-test app-test || true
      - docker rm mysql-test app-test || true
      - docker network rm test-net || true

artifacts:
  files:
    - security-report.xml
    - security-report.html
  discard-paths: yes

reports:
  PostmanSecurityReport:
    files:
      - security-report.xml
    file-format: JUNITXML
