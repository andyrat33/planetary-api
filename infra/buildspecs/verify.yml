version: 0.2

phases:
  build:
    commands:
      - echo "Waiting 15s for ECS task to stabilise..."
      - sleep 15
      - |
        echo ""
        echo "================================================================"
        echo "  DEPLOYMENT COMPLETE"
        echo "  API / Web UI: http://$ALB_DNS"
        echo "================================================================"
        echo ""
      - |
        if [ "$ALLOWED_IP" = "none" ] || [ -z "$ALLOWED_IP" ]; then
          echo "Running live health check..."
          curl -f --retry 5 --retry-delay 10 --max-time 15 http://$ALB_DNS/ || (echo "Health check failed" && exit 1)
          echo "Health check passed."
        else
          echo "ALB locked to $ALLOWED_IP — health check skipped (CodeBuild runs from a different IP)."
          echo "Verify deployment manually at http://$ALB_DNS from $ALLOWED_IP"
        fi
      - |
        cat > deploy-info.txt << EOF
        Deployed at: $(date -u)
        Build:       $CODEBUILD_BUILD_ID
        Commit:      $CODEBUILD_RESOLVED_SOURCE_VERSION
        URL:         http://$ALB_DNS
        EOF
      - cat deploy-info.txt

artifacts:
  files:
    - deploy-info.txt
  discard-paths: yes
