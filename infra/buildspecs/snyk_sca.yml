version: 0.2

env:
  secrets-manager:
    SNYK_TOKEN: "planetary-api/snyk-token:SNYK_TOKEN"

phases:
  install:
    commands:
      - npm install -g snyk --quiet
      - pip install boto3 --quiet
      - snyk auth $SNYK_TOKEN

  build:
    commands:
      - echo "Running Snyk SCA scan..."
      - snyk test --json > snyk-results.json || true   # capture output even when vulnerabilities found
      - echo "Generating SBOM (CycloneDX)..."
      - snyk sbom --format=cyclonedx1.4+json --file=requirements.txt > sbom.json || true
      - echo "Converting Snyk results to ASFF..."
      - python infra/scripts/snyk_to_asff.py snyk-results.json $CODEBUILD_RESOLVED_SOURCE_VERSION snyk-findings.json
      - echo "Importing findings to AWS Security Hub..."
      - |
        FINDING_COUNT=$(python -c "import json; d=json.load(open('snyk-findings.json')); print(len(d))" 2>/dev/null || echo "0")
        echo "Findings to import: $FINDING_COUNT"
        if [ "$FINDING_COUNT" -gt 0 ]; then
          aws securityhub batch-import-findings --findings file://snyk-findings.json
        else
          echo "No Snyk findings to import."
        fi
      - echo "Uploading SBOM and results to S3..."
      - aws s3 cp sbom.json s3://$ARTIFACTS_BUCKET/sbom/$CODEBUILD_BUILD_ID/sbom.json || true
      - aws s3 cp snyk-results.json s3://$ARTIFACTS_BUCKET/snyk/$CODEBUILD_BUILD_ID/snyk-results.json
      - aws s3 cp snyk-findings.json s3://$ARTIFACTS_BUCKET/snyk/$CODEBUILD_BUILD_ID/snyk-findings.json

  post_build:
    commands:
      - echo "Snyk SCA scan complete."

artifacts:
  files:
    - snyk-results.json
    - snyk-findings.json
    - sbom.json
